---
# yamllint disable rule:line-length
name: Coder template push
description: >-
  Pushes the homelab-workspace Terraform template to a Coder deployment
  (already logged in via the coder CLI) and confirms the push landed.

inputs:
  template_dir:
    description: Path to the Terraform template directory.
    required: true
  template_name:
    description: Name of the template to push (created if it does not exist).
    required: true
  template_version:
    description: Name given to the pushed template version.
    required: true
  template_cfg_file:
    description: Path to the template's configuration file with terraform variables configured.
    required: true
  message:
    description: Message recorded on the pushed template version.
    required: false
    default: ""

runs:
  using: composite
  steps:
  - name: Push template
    shell: bash
    env:
      CODER_URL: ${{ inputs.coder_url }}
      TEMPLATE_DIR: ${{ inputs.template_dir }}
      TEMPLATE_NAME: ${{ inputs.template_name }}
      TEMPLATE_VERSION: ${{ inputs.template_version }}
      TEMPLATE_CFG_FILE: ${{ inputs.template_cfg_file }}
      TEMPLATE_MESSAGE: ${{ inputs.message }}
    # yamllint disable-line rule:indentation
    run: |
      existing_version=""
      if coder templates list --output json | jq --exit-status --arg name "${TEMPLATE_NAME}" \
        'any(.[]; .Template.name == $name)' >/dev/null; then
        existing_version="$(coder templates versions list "${TEMPLATE_NAME}" --include-archived --output json | jq --compact-output \
          --arg name "${TEMPLATE_VERSION}" '.[] | select(.TemplateVersion.name == $name)')"
      fi
      if [[ -n "${existing_version}" ]]; then
        existing_status="$(jq --raw-output '.TemplateVersion.job.status' <<<"${existing_version}")"
        existing_active="$(jq --raw-output '.active' <<<"${existing_version}")"
        existing_id="$(jq --raw-output '.TemplateVersion.id' <<<"${existing_version}")"
        if [[ "${existing_status}" != "failed" || "${existing_active}" != "false" ]]; then
          echo "::error::Template version ${TEMPLATE_VERSION} already exists with status=${existing_status}, active=${existing_active}; refusing to replace it."
          exit 1
        fi

        coder_url="$(<"${HOME}/.config/coderv2/url")"
        coder_session_token="$(<"${HOME}/.config/coderv2/session")"
        failed_version_name="${TEMPLATE_VERSION}-failed-${existing_id%%-*}"
        curl --fail --silent --show-error --request PATCH \
          --header "Coder-Session-Token: ${coder_session_token}" \
          --header "Content-Type: application/json" \
          --data "$(jq --null-input --arg name "${failed_version_name}" '{name: $name}')" \
          "${coder_url}/api/v2/templateversions/${existing_id}" >/dev/null
      fi

      echo
      echo "Using template cfg file: ${TEMPLATE_CFG_FILE}"
      cat ${TEMPLATE_CFG_FILE} | sed 's/^/  /'
      echo

      push_args=(
        --directory "${TEMPLATE_DIR}"
        --variables-file "${TEMPLATE_CFG_FILE}"
        --name "${TEMPLATE_VERSION}"
        --yes
      )
      if [[ -n "${TEMPLATE_MESSAGE}" ]]; then
        push_args+=(--message "${TEMPLATE_MESSAGE}")
      fi
      set -x
      coder template push "${push_args[@]}" "${TEMPLATE_NAME}"
      set +x

  - name: Confirm template was published
    shell: bash
    env:
      TEMPLATE_NAME: ${{ inputs.template_name }}
    # yamllint disable-line rule:indentation
    run: |
      coder templates list --output json > "${RUNNER_TEMP}/templates.json"
      export SELECTED_TEMPLATE
      SELECTED_TEMPLATE="$(jq -r --arg name "${TEMPLATE_NAME}" '.[] | select(.Template.name == $name)' "${RUNNER_TEMP}/templates.json")"
      if [[ -z "${SELECTED_TEMPLATE}" ]]; then
        echo "::error::Could not find any template published as ${TEMPLATE_NAME}."
        exit 1
      fi
