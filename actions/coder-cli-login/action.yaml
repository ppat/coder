---
# yamllint disable rule:line-length
name: Coder CLI login
description: >-
  Waits for a Coder deployment to accept connections, installs the matching
  CLI version, and logs the CLI in with a session token obtained via the
  deployment's email/password login endpoint.

inputs:
  coder_url:
    description: Base URL of the Coder deployment.
    required: true
  coder_email:
    description: Email of the user to log in as.
    required: true
  coder_password:
    description: Password of the user to log in as.
    required: true

runs:
  using: composite
  steps:
  - name: Wait for Coder to accept connections
    shell: bash
    env:
      CODER_URL: ${{ inputs.coder_url }}
    run: |
      timeout 5m bash -c "until curl --fail --silent --show-error \"\${CODER_URL}/api/v2/buildinfo\" > /dev/null; do sleep 2; done"

  - name: Install Coder CLI
    shell: bash
    env:
      CODER_URL: ${{ inputs.coder_url }}
    run: |
      export CODER_VERSION
      CODER_VERSION="$(curl --fail --silent --show-error "${CODER_URL}/api/v2/buildinfo" | jq --raw-output .version | cut -d'+' -f1 | cut -d'v' -f2)"
      curl --fail --silent --show-error --location https://coder.com/install.sh | sh -s -- --method standalone --version "${CODER_VERSION}"

  - name: Log in to Coder
    shell: bash
    env:
      CODER_URL: ${{ inputs.coder_url }}
      CODER_EMAIL: ${{ inputs.coder_email }}
      CODER_PASSWORD: ${{ inputs.coder_password }}
    # yamllint disable-line rule:indentation
    run: |
      export CODER_SESSION_TOKEN
      CODER_SESSION_TOKEN="$(curl --fail --silent --show-error -X POST "${CODER_URL}/api/v2/users/login" \
      -H 'Content-Type: application/json' -H 'Accept: application/json' \
      --data "$(jq -n --arg email "${CODER_EMAIL}" --arg password "${CODER_PASSWORD}" '{email: $email, password: $password}')" \
      | jq --raw-output .session_token)"
      echo "::add-mask::${CODER_SESSION_TOKEN}"
      if [[ -z "${CODER_SESSION_TOKEN}" || "${CODER_SESSION_TOKEN}" == "null" ]]; then
        echo "::error::Failed to obtain a Coder session token for ${CODER_EMAIL}."
        exit 1
      fi
      coder login --use-token-as-session "${CODER_URL}"
