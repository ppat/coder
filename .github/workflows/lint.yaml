---
# yamllint disable rule:line-length
name: lint

on:
  pull_request:
    # `edited` fires on a title change. This repo squash-merges with COMMIT_OR_PR_TITLE, so on a
    # multi-commit branch the PR title is the string that lands and that release-please parses -
    # without this, a title edited after checks pass is never re-linted.
    types: [opened, synchronize, reopened, edited]
  schedule:
  - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    uses: ppat/github-workflows/.github/workflows/detect-changed-files.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      # yamllint disable-line rule:indentation
      files_yaml: |
        actions:
        - .github/workflows/**
        docker:
        - '**/Dockerfile'
        markdown:
        - '**.md'
        renovate:
        - .github/renovate.json
        - .github/renovate/**
        shellscripts:
        - '**.sh'
        opentofu:
        - '**.tf'
        - '**/.terraform-version'
        - '**/.terraform.lock.hcl'
        - '.tflint.hcl'
        yaml:
        - '**.yaml'
      git_ref: ${{ github.head_ref || github.ref }}

  opentofu-dirs:
    needs: [detect-changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      opentofu_dirs: ${{ steps.determine-tf-dirs.outputs.dirs }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Determine OpenTofu directories to validate
      id: determine-tf-dirs
      # yamllint disable-line rule:indentation
      run: |
        if [[ "${{ github.event_name }}" != "pull_request" ]]; then
          # For workflow_dispatch, validate all opentofu directories
          TF_DIRS=$(find templates/ -maxdepth 2 -mindepth 2 -type d -not -name '.*' 2>/dev/null | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
        elif [[ "${{ fromJSON(needs.detect-changes.outputs.results).opentofu_any_changed }}" == "true" ]]; then
          # For pull requests, check which files changed
          CHANGED_FILES="${{ fromJSON(needs.detect-changes.outputs.results).opentofu_all_changed_files }}"
          TEMPLATE_CHANGES=$(echo "$CHANGED_FILES" | tr ' ' '\n' | grep '^templates/' || true)
          # Otherwise only validate affected templates
          TF_DIRS=$(echo "$TEMPLATE_CHANGES" | grep -o 'templates/[^/]*' | sort | uniq | tr -d ' ' | jq -R -s -c 'split("\n") | map(select(length > 0))')
        else
          TF_DIRS="[]"
          echo "No OpenTofu changes detected"
        fi
        echo "dirs=$TF_DIRS" >> "$GITHUB_OUTPUT"

  commit-messages:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ppat/github-workflows/.github/workflows/lint-commit-messages.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      git_ref: ${{ github.head_ref }}
      fetch_depth: ${{ github.event.pull_request.commits || 0 }}
      from: ${{ github.event.pull_request.head.sha || 'HEAD' }}~${{ github.event.pull_request.commits || '1' }}
      to: ${{ github.event.pull_request.head.sha || 'HEAD' }}

  # The `commit-messages` job above lints the branch's commits. On a multi-commit branch none of those
  # strings survive: `squash_merge_commit_title` is COMMIT_OR_PR_TITLE, so GitHub lands the PR title
  # instead, and that is the string release-please parses for the version bump. It is linted nowhere else,
  # which is why this job exists rather than being folded into the reusable workflow - that one takes a
  # commit range, and a PR title is not in the history until after the merge it decides.
  pr-title:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.commits > 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@f66c9acb40309305e0e1fd3179406b85647aa54c # v2.3.2
      with:
        current_fetch_depth: 1
        current_git_ref: ${{ github.head_ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}
        mise_toml: |
          [tools]
          bun               = "1.4.0"
          node              = "24.19.0"
          [settings.npm]
          bun               = true

    # This repo tracks no package.json, so the commitlint packages come from ppat/github-workflows the
    # same way its own lint-commit-messages.yaml sources them. Keeping the manifest there rather than
    # duplicating four pinned versions here is what stops this job drifting from that one.
    - name: Checkout github-workflows
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        path: tools
        repository: ppat/github-workflows
        ref: main
        persist-credentials: false

    - name: Install node packages
      shell: bash
      working-directory: ./current
      run: |
        cp "$GITHUB_WORKSPACE/tools/package.json" .
        cp "$GITHUB_WORKSPACE/tools/bun.lock" .
        bun install --frozen-lockfile

    # The title crosses via env, never interpolated into the script: it is attacker-controllable text.
    - name: Lint pull request title
      shell: bash
      working-directory: ./current
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        printf '%s\n' "$PR_TITLE" | bunx commitlint --color --verbose

  github-actions:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).actions_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-github-actions.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).actions_all_changed_files }}

  markdown:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).markdown_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-markdown.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).markdown_all_changed_files }}

  docker-files:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).docker_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-hadolint.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).docker_all_changed_files }}
      hadolint_config: .hadolint.yaml

  pre-commit:
    uses: ppat/github-workflows/.github/workflows/lint-pre-commit.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}

  renovate-config-check:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).renovate_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-renovate-config-check.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).renovate_all_changed_files }}

  shellcheck:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).shellscripts_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-shellcheck.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).shellscripts_all_changed_files }}

  opentofu:
    needs: [opentofu-dirs]
    if: ${{ github.event_name != 'pull_request' || needs.opentofu-dirs.outputs.opentofu_dirs != '[]' }}
    uses: ppat/github-workflows/.github/workflows/lint-opentofu.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      tofu_dirs: ${{ needs.opentofu-dirs.outputs.opentofu_dirs }}

  yaml:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).yaml_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-yaml.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).yaml_all_changed_files }}

  zizmor:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).actions_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-zizmor.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
