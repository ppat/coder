---
# yamllint disable rule:line-length
name: test template

on:
  pull_request:
    paths:
    - actions/**
    - .github/compose/**
    - .github/workflows/test-template.yaml
    - templates/kubernetes/homelab-workspace/**
    - test/**
    - mise.toml
    - mise.lock

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CODER_SSH_WAIT: "no"
  COMPOSE_FILE: current/.github/compose/compose.yaml
  TEMPLATE_NAME: homelab-workspace-test
  WORKSPACE_NAME: template-test

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout automation actions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
        path: .automation
        ref: ${{ github.head_ref || github.ref }}

    - name: Setup repository and tools
      # Checks the repo out into current/ (hence the current/ prefix on every path
      # reference below) and, with no mise_toml override, installs straight from
      # current/mise.toml - the same `opentofu` pin the authoring toolchain uses
      # locally, so there's no second version string to drift from it.
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@b243512e70e84044d607787b1f482881906b0f01 # v3.0.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ github.token }}

    - name: Setup local coder deployment
      id: setup_local_coder
      uses: ./.automation/actions/coder-local-start
      with:
        docker_compose_file: ${{ env.COMPOSE_FILE }}
        coder_email: ci@example.invalid
        coder_password: ci-password

    - name: Log in to Coder CLI
      uses: ./.automation/actions/coder-cli-login
      with:
        coder_url: ${{ steps.setup_local_coder.outputs.coder_url }}
        coder_email: ci@example.invalid
        coder_password: ci-password

    - name: Prepare template configuration
      id: template_cfg
      env:
        GH_TOKEN: ${{ github.token }}
        TEMPLATE_CFG_FILE: ${{ runner.temp }}/template-config.yaml
      shell: bash
      run: |
        RELEASE_TAG="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)"

        cat <<EOF > "${TEMPLATE_CFG_FILE}"
        workspace_image: ghcr.io/ppat/coder-workspace:${RELEASE_TAG}
        home_pvc_storage_class: standard
        tmp_pvc_storage_class: standard
        kubernetes_config_path: /home/coder/.kube/config
        skip_dotfiles_scripts: "true"
        EOF

        echo "template_cfg_file=${TEMPLATE_CFG_FILE}" >> "${GITHUB_OUTPUT}"

    - name: Publish template
      uses: ./.automation/actions/coder-template-push
      with:
        template_dir: current/templates/kubernetes/homelab-workspace
        template_name: ${{ env.TEMPLATE_NAME }}
        template_version: ${{ github.sha }}
        template_cfg_file: ${{ steps.template_cfg.outputs.template_cfg_file }}

    - name: Create workspace
      uses: ./.automation/actions/coder-workspace-create
      with:
        template_name: ${{ env.TEMPLATE_NAME }}
        workspace_name: ${{ env.WORKSPACE_NAME }}

    - name: Confirm script bundle is present within workspace
      shell: bash
      run: ./.automation/test/check-script-bundle.sh "${WORKSPACE_NAME}.main"

    - name: Confirm dotfiles were applied
      shell: bash
      run: timeout 15m ./.automation/test/confirm-dotfiles-applied.sh "${WORKSPACE_NAME}.main"

    - name: Confirm supervised service starts after dotfiles and restarts
      shell: bash
      run: timeout 15m ./.automation/test/confirm-supervised-service-status.sh "${WORKSPACE_NAME}.main"

    - name: Show dotfiles log
      if: always()
      run: coder ssh "${WORKSPACE_NAME}.main" -- cat /home/coder/.local/state/dotfiles/run.log || true

    - name: Confirm workspace restart behavior - home PVC survives and tmp PVC is replaced
      shell: bash
      run: ./.automation/test/confirm-storage-volume-behavior.sh "${WORKSPACE_NAME}.main"

    - name: Show Coder logs on failure
      if: failure()
      shell: bash
      run: |
        kubectl --namespace coder get pods --output wide || true
        echo
        kubectl --namespace coder logs \
        --selector "com.coder.workspace.name=${WORKSPACE_NAME}" \
        --all-containers --prefix --tail=200 || true
        echo
        docker compose -f "${COMPOSE_FILE}" logs
