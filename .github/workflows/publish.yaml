---
# yamllint disable rule:line-length
name: publish

on:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: true

env:
  image_name: ${{ secrets.CONTAINER_REGISTRY }}/${{ vars.CONTAINER_REGISTRY_PATH }}/coder-workspace
  image_cache_name: ${{ secrets.CONTAINER_REGISTRY }}/${{ vars.CONTAINER_REGISTRY_CACHE_PATH }}/coder-workspace
  image_path: images/homelab-workspace
  template_path: templates/kubernetes/homelab-workspace
  template_name: homelab-workspace
  source_ref: ${{ github.event.release.tag_name || inputs.release_tag }}
  source_sha: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  publish-image:
    permissions:
      contents: read
      packages: write
    uses: ppat/github-workflows/.github/workflows/build-docker-image.yaml@e14e9bf7b53f4094382443db8bbff9e7d6b1e5b1 # v8.1.0 (unmerged PR #615 -- repoint to the v6.0.0 tag before merge)
    with:
      image_context_path: images/homelab-workspace
      label_title: "Homelab Workspace"
      label_description: "Homelab workspace image"
      platforms: linux/amd64,linux/arm64
      private_registry_repository: ${{ vars.CONTAINER_REGISTRY_PATH }}/coder-workspace
      private_registry_build_cache: ${{ vars.CONTAINER_REGISTRY_CACHE_PATH }}/coder-workspace
      git_ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      ghcr_repository: ppat/coder-workspace
      timeout_minutes: 180
    secrets:
      private_registry_username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
      private_registry_token: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
      private_registry: ${{ secrets.CONTAINER_REGISTRY }}
      tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      tailscale_oauth_secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
      build_secrets: |
        FETCH_GH_TOKEN=${{ secrets.GITHUB_TOKEN }}

  publish-template:
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout publishing automation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
        path: .automation
        ref: main

    - name: Checkout release source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
        path: release
        ref: ${{ env.source_ref }}

    - name: Tailscale Connect
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      with:
        oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        tags: tag:github-action-ci-runner
        # renovate: datasource=github-releases depName=tailscale/tailscale
        version: "1.102.4"

    - name: Login to Coder
      uses: ./.automation/actions/coder-cli-login
      with:
        coder_url: ${{ secrets.CODER_URL }}
        coder_email: ${{ secrets.CODER_EMAIL }}
        coder_password: ${{ secrets.CODER_PASSWORD }}

    - name: Publish template
      uses: ./.automation/actions/coder-template-push
      with:
        template_dir: release/${{ env.template_path }}
        template_name: ${{ env.template_name }}
        template_version: ${{ env.source_sha }}
        workspace_image: "ghcr.io/ppat/coder-workspace:${{ needs.publish-image.outputs.image_tag }}"
        home_pvc_storage_class: sc-longhorn-replicated
        tmp_pvc_storage_class: sc-longhorn-local-non-replicated-ephemeral
        kubernetes_config_path: ""
        skip_dotfiles_scripts: "false"
        message: "[Release Notes](https://github.com/${{ github.repository }}/releases/tag/${{ env.source_sha }})"

    - name: Tailscale Disconnect
      if: success() || failure()
      run: sudo -E tailscale logout
